version: 2

project_name: grpctui

# HOMEBREW_TAP_TOKEN is declared with an empty default so that the cask's
# templates can ask whether it is set. GoReleaser fails a template that reads an
# environment variable which is not there at all, which would turn "no tap
# token" into "no release".
env:
  - HOMEBREW_TAP_TOKEN={{ if index .Env "HOMEBREW_TAP_TOKEN" }}{{ .Env.HOMEBREW_TAP_TOKEN }}{{ end }}
  - DOCKERHUB_TOKEN={{ if index .Env "DOCKERHUB_TOKEN" }}{{ .Env.DOCKERHUB_TOKEN }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - id: grpctui
    main: ./cmd/grpctui
    binary: grpctui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Read by internal/version as a *fallback*: `go install` builds get no
      # ldflags at all and fall back to runtime/debug build info instead.
      - -X github.com/alonshuld/grpctui/internal/version.version={{ .Version }}

archives:
  - id: grpctui
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

# The Homebrew tap, published to github.com/alonshuld/homebrew-tap so that
# `brew install alonshuld/tap/grpctui` works on macOS and on Linux — GoReleaser
# writes an on_linux block from the same archives. It is a cask rather than a
# formula: a formula for a pre-built binary is deprecated upstream, and building
# from source is what `go install` is already for.
#
# The tap is a *different repository*, which the release job's GITHUB_TOKEN
# cannot write to — that token is scoped to this one. HOMEBREW_TAP_TOKEN is a
# PAT with contents:write on the tap; when it is absent the cask is built and
# not pushed, so a release still happens and the binaries still land. A tap that
# silently stopped updating would be worse, so the release notes say which.
homebrew_casks:
  - name: grpctui
    binaries: [grpctui]
    homepage: https://github.com/alonshuld/grpctui
    description: A terminal UI for exploring, calling, and debugging gRPC services

    # Completions are not installed by the cask: `grpctui completion <shell>`
    # prints them, and where a shell looks for them is the user's own business.
    caveats: |
      Shell completions:
        grpctui completion zsh > ~/.zsh/completions/_grpctui

    repository:
      owner: alonshuld
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    commit_msg_template: "grpctui {{ .Tag }}"

    # A prerelease does not become what `brew install grpctui` gives you, and
    # neither does a release built without the tap token.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}auto{{ else }}true{{ end }}'

    hooks:
      post:
        # The binaries are not notarised, so macOS quarantines them and the
        # first run is a dialog rather than a TUI. Stripping the attribute is
        # the documented workaround where signing is not on the table; it is
        # deliberately the only thing the cask does to the machine.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/grpctui"]
          end

# The image is published to Docker Hub as alonshuld/grpctui — docker.io is the
# default registry, so the name carries no host. It packages the same binaries
# the archives do rather than compiling its own, which is what keeps `docker run`
# and the tarball byte-identical.
#
# Like the cask, this needs a credential the repository does not have by default:
# DOCKERHUB_TOKEN is a Read & Write access token. Unlike the cask, GoReleaser has
# no build-but-do-not-push switch here, so `disable` skips the image outright
# when the token is absent and the binaries still ship. A snapshot is exempt —
# `make snapshot` builds the image locally and pushes nothing, which is the only
# way to exercise the Dockerfile before a tag.
dockers_v2:
  - id: grpctui
    images:
      - alonshuld/grpctui
    tags:
      - "{{ .Version }}"
      # A prerelease is not what `docker pull alonshuld/grpctui` should give you,
      # for the same reason it is not what `brew install` gives you. An empty tag
      # is skipped rather than pushed as "".
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    disable: '{{ if .IsSnapshot }}false{{ else if .Env.DOCKERHUB_TOKEN }}false{{ else }}true{{ end }}'
    labels:
      org.opencontainers.image.title: grpctui
      org.opencontainers.image.description: A terminal UI for exploring, calling, and debugging gRPC services
      org.opencontainers.image.source: https://github.com/alonshuld/grpctui
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  draft: false
  prerelease: auto
