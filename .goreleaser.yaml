version: 2

project_name: grpctui

# DOCKERHUB_TOKEN is declared with an empty default so that the image's
# templates can ask whether it is set. GoReleaser fails a template that reads an
# environment variable which is not there at all, which would turn "no Docker
# Hub token" into "no release".
env:
  - DOCKERHUB_TOKEN={{ if index .Env "DOCKERHUB_TOKEN" }}{{ .Env.DOCKERHUB_TOKEN }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - id: grpctui
    main: ./cmd/grpctui
    binary: grpctui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Read by internal/version as a *fallback*: `go install` builds get no
      # ldflags at all and fall back to runtime/debug build info instead.
      - -X github.com/alonshuld/grpctui/internal/version.version={{ .Version }}

archives:
  - id: grpctui
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

# The image is published to Docker Hub as alonshuld/grpctui — docker.io is the
# default registry, so the name carries no host. It packages the same binaries
# the archives do rather than compiling its own, which is what keeps `docker run`
# and the tarball byte-identical.
#
# It needs a credential the repository does not have by default: DOCKERHUB_TOKEN
# is a Read & Write access token. GoReleaser has no build-but-do-not-push switch
# here, so `disable` skips the image outright when the token is absent and the
# binaries still ship. A snapshot is exempt — `make snapshot` builds the image
# locally and pushes nothing, which is the only way to exercise the Dockerfile
# before a tag.
dockers_v2:
  - id: grpctui
    images:
      - alonshuld/grpctui
    tags:
      - "{{ .Version }}"
      # A prerelease is not what `docker pull alonshuld/grpctui` should give
      # you. An empty tag is skipped rather than pushed as "".
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    disable: '{{ if .IsSnapshot }}false{{ else if .Env.DOCKERHUB_TOKEN }}false{{ else }}true{{ end }}'
    labels:
      org.opencontainers.image.title: grpctui
      org.opencontainers.image.description: A terminal UI for exploring, calling, and debugging gRPC services
      org.opencontainers.image.source: https://github.com/alonshuld/grpctui
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  draft: false
  prerelease: auto
