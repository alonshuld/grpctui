version: 2

project_name: grpctui

before:
  hooks:
    - go mod tidy

builds:
  - id: grpctui
    main: ./cmd/grpctui
    binary: grpctui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Read by internal/version as a *fallback*: `go install` builds get no
      # ldflags at all and fall back to runtime/debug build info instead.
      - -X github.com/alonshuld/grpctui/internal/version.version={{ .Version }}

archives:
  - id: grpctui
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  draft: false
  prerelease: auto
